<a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50 focus:bg-white focus:border focus:border-slate-300 focus:rounded-md focus:px-3 focus:py-2 text-sm">Skip to content</a>
<header class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-6">

        <a href="/" class="flex items-center gap-2.5 shrink-0" aria-label="iLoveChem home">
            <span class="w-8 h-8 rounded-md bg-blue-600 text-white flex items-center justify-center">
                <svg class="w-4.5 h-4.5" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M10 2v5.5L4.5 18a2.5 2.5 0 0 0 2.2 3.5h10.6a2.5 2.5 0 0 0 2.2-3.5L14 7.5V2"/>
                    <path d="M8.5 2h7"/>
                    <path d="M7 14.5c2.5-1 4.5 1 7 0"/>
                </svg>
            </span>
            <span class="text-lg font-semibold tracking-tight text-slate-900">iLove<span class="text-blue-600">Chem</span></span>
        </a>

        <nav class="hidden md:flex items-center gap-1 text-sm" aria-label="Primary">
            <a href="/" class="px-3 py-1.5 rounded-md hover:bg-slate-100 {% if page == 'studio' %}text-blue-700 font-semibold bg-blue-50{% else %}text-slate-700{% endif %}" {% if page == 'studio' %}aria-current="page"{% endif %}>Converter</a>
            <a href="/properties/" class="px-3 py-1.5 rounded-md hover:bg-slate-100 {% if page == 'properties' %}text-blue-700 font-semibold bg-blue-50{% else %}text-slate-700{% endif %}" {% if page == 'properties' %}aria-current="page"{% endif %}>Properties</a>
            <a href="/docking/" class="px-3 py-1.5 rounded-md hover:bg-slate-100 {% if page == 'docking' %}text-blue-700 font-semibold bg-blue-50{% else %}text-slate-700{% endif %}" {% if page == 'docking' %}aria-current="page"{% endif %}>Docking</a>
            <a href="/downloads/" class="px-3 py-1.5 rounded-md hover:bg-slate-100 {% if page == 'downloads' %}text-blue-700 font-semibold bg-blue-50{% else %}text-slate-700{% endif %}" {% if page == 'downloads' %}aria-current="page"{% endif %}>Downloads</a>
            <a href="/about/" class="px-3 py-1.5 rounded-md hover:bg-slate-100 {% if page == 'about' %}text-blue-700 font-semibold bg-blue-50{% else %}text-slate-700{% endif %}" {% if page == 'about' %}aria-current="page"{% endif %}>About</a>
        </nav>

        <div class="flex items-center gap-2">
            <a href="https://github.com/shivamrathore12336-dev/ilovechem" target="_blank" rel="noopener noreferrer"
               class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md border border-slate-200 text-sm text-slate-700 hover:bg-slate-50">
                <i data-lucide="github" class="w-4 h-4" aria-hidden="true"></i><span>Source</span>
            </a>
            <button type="button" id="mobile-menu-btn" aria-controls="mobile-nav-drawer" aria-expanded="false" aria-label="Open menu"
                    class="md:hidden p-2 rounded-md text-slate-700 hover:bg-slate-100 border border-slate-200">
                <i data-lucide="menu" class="w-5 h-5" id="mobile-menu-icon" aria-hidden="true"></i>
            </button>
        </div>
    </div>

    <nav id="mobile-nav-drawer" class="hidden md:hidden border-t border-slate-200 bg-white px-4 py-2" aria-label="Mobile">
        <ul class="text-sm divide-y divide-slate-100">
            <li><a class="block py-3 {% if page == 'studio' %}text-blue-700 font-semibold{% else %}text-slate-800{% endif %}" href="/">Converter</a></li>
            <li><a class="block py-3 {% if page == 'properties' %}text-blue-700 font-semibold{% else %}text-slate-800{% endif %}" href="/properties/">Properties</a></li>
            <li><a class="block py-3 {% if page == 'docking' %}text-blue-700 font-semibold{% else %}text-slate-800{% endif %}" href="/docking/">Docking</a></li>
            <li><a class="block py-3 {% if page == 'downloads' %}text-blue-700 font-semibold{% else %}text-slate-800{% endif %}" href="/downloads/">Downloads</a></li>

            <li><a class="block py-3 text-slate-800" href="https://github.com/shivamrathore12336-dev/ilovechem" target="_blank" rel="noopener noreferrer">Source on GitHub</a></li>
        </ul>
    </nav>
</header>
<script>
(function () {
    var btn = document.getElementById('mobile-menu-btn');
    var drawer = document.getElementById('mobile-nav-drawer');
    if (!btn || !drawer) return;
    function setOpen(open) {
        drawer.classList.toggle('hidden', !open);
        btn.setAttribute('aria-expanded', String(open));
        btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
        var icon = document.getElementById('mobile-menu-icon');
        if (icon) { icon.setAttribute('data-lucide', open ? 'x' : 'menu'); if (window.lucide) lucide.createIcons(); }
    }
    btn.addEventListener('click', function () { setOpen(drawer.classList.contains('hidden')); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
    document.addEventListener('click', function (e) {
        if (drawer.classList.contains('hidden')) return;
        // composedPath() is captured at dispatch time. e.target can already be detached by
        // lucide.createIcons() (it swaps the <i> for an <svg>), so contains() would give a false "outside".
        var path = e.composedPath ? e.composedPath() : [];
        if (path.indexOf(btn) !== -1 || path.indexOf(drawer) !== -1) return;
        setOpen(false);
    });
    // Legacy hook: some inline handlers call this.
    window.toggleMobileMenu = function () { setOpen(drawer.classList.contains('hidden')); };
})();
</script>
