services:
  - type: web
    name: ilovechem
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: SITE_URL
        value: https://ilovechem.onrender.com
      - key: ALLOWED_HOSTS
        value: ilovechem.onrender.com,localhost,127.0.0.1
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CSRF_COOKIE_SECURE
        value: "true"
      # Free plan has 512 MB RAM; RDKit + OpenBabel + ASE + SciPy per worker is heavy.
      # Raise on a paid plan.
      - key: WEB_CONCURRENCY
        value: "1"

